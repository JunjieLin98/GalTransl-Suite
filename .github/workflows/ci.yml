name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -e . pytest
      # 上游 7.4.0 自带测试回归(UPSTREAM.md 有记录):translate_refactor 8 项
      # (AttributeError: max_api_retries)+ incremental_cache 1 项(mock 缺 getProjectDir)
      # test_server_ext_live.py 已加 __main__ 守卫,pytest 收集安全(0 用例);
      # 真实运行需本机样例游戏,仅手动执行
      - name: Run tests
        run: >
          python -m pytest tests/ -q
          --ignore=tests/test_translate_refactor_regressions.py
          --deselect tests/test_incremental_cache_append.py::IncrementalCacheAppendTests::test_batch_translate_saves_only_incremental_results
        env:
          PYTHONIOENCODING: utf-8

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  package-backend:
    # M6:后端单文件 exe 冒烟(PyInstaller 产物启动 + API 可达 + profiles 可读)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -e . pyinstaller
      - name: Build release layout
        run: python scripts/build_windows.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Smoke test frozen backend
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "release/app/backend/galtransl_backend.exe" `
            -ArgumentList "--port","12401" -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $v = Invoke-RestMethod "http://127.0.0.1:12401/api/version" -TimeoutSec 5
                if ($v.version) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "frozen backend did not respond" }
            $p = Invoke-RestMethod "http://127.0.0.1:12401/api/pipeline/profiles" `
              -Headers @{ Origin = "http://127.0.0.1:1420" } -TimeoutSec 5
            if (-not $p.profiles -or $p.profiles.Count -lt 3) { throw "profiles missing in frozen build" }
            Write-Host "frozen backend OK, profiles: $($p.profiles.Count)"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: galtransl-backend-windows
          path: release/app/
          retention-days: 7
