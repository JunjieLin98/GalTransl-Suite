[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galtrans-pipeline"
version = "1.0.1"
description = "GalTransl Suite — 通用 Galgame LLM 汉化套件编排层(GalTransl fork)"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PyYAML>=6.0", "UnityPy>=1.25"]  # UnityPy: unity profile(M5)文本提取/回封

[project.scripts]
galtrans = "galtrans_pipeline.cli:main"

[tool.setuptools]
packages = ["galtrans_pipeline"]
